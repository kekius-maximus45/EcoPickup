<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">♻</span>EcoPickup</a><button class="menu-toggle">☰</button><nav class="main-nav"><a href="index.html">Home</a><a class="active" href="marketplace.html">Browse Items</a><a href="add-item.html">List an Item</a><a href="seller-dashboard.html">Dashboard</a><a href="login.html">Login</a><a class="button button-small" href="signup.html">Sign Up</a></nav></header>
