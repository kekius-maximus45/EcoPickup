spring.application.name=EcoPickup
server.port=8080

# Load developer secrets from backend/.env when the file exists. The extension
# hint tells Spring Boot to read the extensionless file as Java properties.
spring.config.import=optional:file:.env[.properties]

# Persistent local demo database. Data remains available after restarting the app.
spring.datasource.url=jdbc:h2:file:./data/ecopickup;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=always

# Always serve the current frontend during development. This prevents different
# tabs from running old and new session-storage code at the same time.
spring.web.resources.cache.cachecontrol.no-store=true

# Item photos are stored outside the build output so they survive restarts.
ecopickup.upload-dir=${UPLOAD_DIR:./uploads/items}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Two-step login. SMTP configuration is required because verification codes
# are delivered only by email and are never displayed in the browser.
ecopickup.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:300}
ecopickup.mail.from=${MAIL_FROM:no-reply@ecopickup.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
